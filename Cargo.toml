[package]
name = "simpics-ui"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["src-tauri", "src-tauri/migration", "shared"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
optional_struct = "0.5.2"
simpics-shared = { path = "shared" }

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-logger = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["router"] }
dioxus-icons = { version = "0.1.0", default-features = false }

# from workspace
serde.workspace = true
serde_json.workspace = true
simpics-shared.workspace = true
chrono.workspace = true
